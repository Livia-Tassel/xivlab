[project]
name = "xivlab"
version = "0.1.0"
description = "Research AI tools — arXiv digest + PromptHub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.0",
  "bcrypt>=4.0",
  "python-multipart>=0.0.12",
  "jinja2>=3.1",
  "httpx>=0.27",
  "feedparser>=6.0",
  "structlog>=24.4",
  "apscheduler>=3.10",
  "resend>=2.4",
  "openai>=1.50",
  "sqlite-vec>=0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "factory-boy>=3.3",
  "ruff>=0.7",
  "pyright>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
