{% extends "base.html" %}
{% block title %}Reset password · xivLab{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border rounded-lg p-6">
  <h1 class="text-xl font-semibold mb-4">Reset password</h1>
  {% if done %}
    <p class="text-zinc-700">Password updated. <a href="/login" class="underline">Sign in</a> with your new password.</p>
  {% else %}
    {% if error %}<p class="text-red-600 text-sm mb-3">{{ error }}</p>{% endif %}
    <form method="post" action="/reset-password" class="space-y-3">
      <input type="hidden" name="token" value="{{ token }}"/>
      <input type="password" name="new_password" placeholder="New password (8+ chars)" required minlength="8" class="w-full border rounded px-3 py-2"/>
      <button class="w-full bg-zinc-900 text-white rounded py-2">Update password</button>
    </form>
  {% endif %}
</div>
{% endblock %}
